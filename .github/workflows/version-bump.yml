name: Version bump

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Run version bump
        run: ./ci/claude.versionbump.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/claude-code-version-bump"
          VERSION="$(awk '/^Version:/{print $2}' claude-code.spec)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add claude-code.spec SOURCES
          git commit -m "chore: bump claude-code to $VERSION"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create \
              --base "${{ github.ref_name }}" \
              --head "$BRANCH" \
              --title "chore: bump claude-code to $VERSION" \
              --body "Automated version bump via \`ci/claude.versionbump.sh\`."
          fi
